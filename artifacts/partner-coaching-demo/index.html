y-content:space-between;gap:16px;align-items:center;margin:14px 0;flex-wrap:wrap}.notice{background:#fff4d8;padding:14px 18px;border-radius:8px;line-height:1.5}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:15px 9px;border-bottom:1px solid #e4e7df}th{font-size:13px;color:#627568}.table-wrap{overflow:auto}dialog{border:0;border-radius:16px;padding:30px;max-width:600px;width:92%;color:#163d3b}dialog::backdrop{background:#102b2bcc}label{line-height:1.6}footer{padding:22px 4%;color:#65766a;font-size:13px}#status{position:sticky;bottom:15px;margin:0 30px;background:#163e36;color:white;padding:14px;border-radius:8px}#status:empty{display:none}@media(max-width:950px){.grid{grid-template-columns:1fr}.layout{grid-template-columns:1fr}nav{display:flex;overflow:auto;padding:12px;border-right:0}nav button{white-space:nowrap;width:auto;margin:0}main{padding:22px}header{align-items:flex-start}h1{font-size:30px}}
.field{display:block;margin:16px 0}.field input,.field textarea{display:block;width:100%;padding:12px;border:1px solid #b8c8bd;border-radius:8px;font:inherit;margin-top:5px}.field input[type=color]{height:48px}.subnav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.brandmark{width:64px;height:64px;display:grid;place-items:center;background:var(--brand,#164c43);color:white;border-radius:15px;font-size:25px;font-weight:bold}.brandmark img{width:100%;height:100%;object-fit:contain}.split{display:grid;grid-template-columns:1fr 1fr;gap:24px}.empty{text-align:center;padding:36px}.hint{font-size:14px;color:#61706a}@media(max-width:950px){.split{grid-template-columns:1fr}}</style><header><div><strong>LC / Leader Continuity</strong><small>Coaching & partner workspace</small></div><span class="tag" style="color:#143e36">Interactive concept · fictional data</span></header><div class="toolbar"><label>Client scenario <select id="scenario"><option value="partner">Partner company referral</option><option value="independent">Independent coach referral</option><option value="direct">Direct customer</option></select></label><span class="muted">Sample prices and splits · No real payments</span><button id="reset">Reset demo</button></div><div class="layout"><nav id="nav"></nav><main id="main"></main></div><div id="status" role="status" aria-live="polite"></div><footer>Demo only. Views simulate permissions; production access must be enforced on the server. Changes reset on reload.</footer><dialog id="modal"></dialog><script>
const coaches=[{id:'maya',name:'Maya Bennett',initials:'MB',company:'Summit Leadership',focus:'Executive coaching',bio:'Helps senior leaders translate feedback into clear decisions, stronger delegation, and consistent follow-through.',price:600,call:175},{id:'daniel',name:'Daniel Reed',initials:'DR',company:'Summit Leadership',focus:'Leadership development',bio:'Works with emerging leaders on accountability, team effectiveness, and leading through organizational change.',price:500,call:150},{id:'alex',name:'Alex Morgan',initials:'AM',company:'Independent',focus:'Executive transitions',bio:'Supports leaders navigating new responsibilities, difficult conversations, and organizational transitions.',price:650,call:190},{id:'nia',name:'Nia Brooks',initials:'NB',company:'Independent',focus:'Team leadership',bio:'Partners with leaders to build trust, clarify expectations, and develop confident, capable teams.',price:550,call:160}];
let scenario='partner',page='Welcome',engagements={partner:null,independent:{id:'alex',kind:'monthly'},direct:null},events=[];const main=document.querySelector('#main'),modal=document.querySelector('#modal');const money=n=>'$'+n.toLocaleString('en-US',{maximumFractionDigits:2});const source=()=>scenario==='partner'?'Summit Leadership':scenario==='independent'?'Alex Morgan':'None — direct signup';const allowed=()=>scenario==='partner'?coaches.filter(c=>c.company==='Summit Leadership'):coaches;const current=()=>engagements[scenario];
function announce(s){document.querySelector('#status').textContent=s}function action(label,fn,cls=''){return `<button type="button" class="${cls}" data-action="${fn}">${label}</button>`}function render(){document.querySelector('#nav').innerHTML=['Company setup','Welcome','Find a coach','My development','Billing & referrals','Partner workspace','Coach workspace','Build roadmap'].map(p=>`<button class="${p===page?'active':''}" data-page="${p}">${p}</button>`).join('');let e=current(),c=e&&coaches.find(x=>x.id===e.id);const intro=`<div class="eyebrow">${scenario==='partner'?'Summit Leadership / client experience':'Leader Continuity / client experience'}</div>`;
if(page==='Welcome')main.innerHTML=intro+`<section class="hero"><div class="eyebrow">${scenario==='partner'?'Summit Leadership + Leader Continuity':'Your leadership. Your next step.'}</div><h1>${scenario==='partner'?'Your development, connected.':'Build your next chapter.'}</h1><p>Bring your goals, development plan, and coaching conversations together in one place.</p>${action('Explore your coaches','directory','primary')} <span class="tag">${scenario==='partner'?'Referral: SUMMIT':scenario==='independent'?'Referral: ALEX':'Direct customer'}</span></section><div class="grid"><article class="card"><h3>Your coaching choice</h3><p>${scenario==='partner'?'Choose and change coaches within Summit Leadership’s roster.':'Choose from the open coach directory. You can change coaches at any time under your service terms.'}</p></article><article class="card"><h3>Your development stays</h3><p>Your goals, action plan, and shared session summaries remain with you when coaching changes.</p></article><article class="card"><h3>A clear relationship</h3><p>Referral source: <strong>${source()}</strong>. ${scenario==='direct'?'No subscription referral commission.':'The original source retains its agreed share while your subscription continually renews.'}</p></article></div><p class="muted">Fictional client: Jordan Williams at Cedar Valley Group. ${scenario==='partner'?'Illustrative branded signup URL: /partners/summit?ref=SUMMIT':''}</p>`;
if(page==='Find a coach')main.innerHTML=intro+`<h1>Find your next coach</h1><p>${scenario==='partner'?'Your Summit Leadership coaching team. Change coaches within this roster.':'Explore coaches across the marketplace, regardless of who originally referred you.'}</p><div class="grid">${allowed().map(x=>`<article class="card"><div class="avatar">${x.initials}</div><h2>${x.name}</h2><span class="tag">${x.company}</span><h3 style="margin-top:20px">${x.focus}</h3><p>${x.bio}</p><p class="price">${money(x.price)} <small>/ month</small></p><p class="muted">Or ${money(x.call)} per 50-minute session</p>${action(c?.id===x.id?'View current coach':'Profile & service terms','profile:'+x.id)}</article>`).join('')}</div>`;
if(page==='My development')main.innerHTML=intro+`<h1>Your coaching, your progress</h1><div class="row"><span class="tag">Jordan Williams · Director of Operations</span><span class="tag">Software subscription active</span></div><div class="grid"><article class="card"><h3>${c?'Your coach':'Ready for a new coach'}</h3><p>${c?c.name+' · '+c.company:'Your development record is ready whenever you choose a coach.'}</p><p>${e?e.kind==='monthly'?'Monthly package · two sessions':'Single 50-minute session':'No active coaching charges'}</p>${c?action('End coaching engagement','end'):action('Choose a coach','directory','primary')}</article><article class="card"><h3>Current goals</h3><p>Delegate two recurring decisions.</p><p>Establish a weekly accountability check-in.</p><span class="tag">2 of 3 commitments complete</span></article><article class="card"><h3>Shared session summary</h3><p>Practice assigning decisions with clear ownership and an agreed check-in date.</p><span class="tag">Owned by the client</span><p class="muted">${c?'Shared with your active coach.':'Retained. Share with a new coach when you hire them.'}</p></article></div><div class="notice">Subscription referral source: ${source()}. Ending coaching does not change subscription referral credit. ${scenario==='partner'?'Your next coach must be within Summit Leadership.':'Your next coach can be any eligible marketplace coach.'}</div>`;
if(page==='Billing & referrals')main.innerHTML=intro+`<h1>Two services. Clear billing.</h1><p>Illustrative amounts; taxes and processing fees excluded. Split percentages are placeholders.</p><div class="grid"><article class="card"><h3>Annual software subscription</h3><p class="price">$1,200 / year</p><p>Referral source: ${source()}</p><p>${scenario==='direct'?'Platform: $1,200 · Referral: $0':'Original referrer: $240 (20%)<br>Platform: $960 (80%)'}</p><span class="tag">Continues through paid renewals</span></article><article class="card"><h3>Coaching service</h3>${c?`<p>${c.name}</p><p class="price">${money(e.kind==='monthly'?c.price:c.call)} / ${e.kind==='monthly'?'month':'session'}</p><p>Provider: ${money((e.kind==='monthly'?c.price:c.call)*.8)} (80%)<br>Platform: ${money((e.kind==='monthly'?c.price:c.call)*.2)} (20%)</p><p>Recipient: ${c.company==='Independent'?c.name:c.company}</p>`:'<p>No active engagement. Your software subscription continues.</p>'}</article><article class="card"><h3>Payment settings</h3><p>Example payer: Cedar Valley Group</p><p>Organization approval is required before employer-funded coaching begins.</p><p class="muted">No payment information is collected in this demo.</p></article></div><h2>Demo activity</h2><p>${events.length?events.join('<br>'):'Hire or end a coaching engagement to see activity here.'}</p>`;
if(page==='Partner workspace')main.innerHTML=`<div class="eyebrow">Partner administrator / Summit Leadership</div><h1>Your client relationships</h1><p>Only Summit’s associated clients and financial activity appear in this view.</p><div class="grid"><article class="card"><h3>Referred organizations</h3><p class="price">1</p><p>Cedar Valley Group</p></article><article class="card"><h3>Annual referral share</h3><p class="price">$240</p><p>Illustrative 20% of $1,200 collected</p></article><article class="card"><h3>Your coaching team</h3><p>Maya Bennett · Daniel Reed</p><p class="muted">Company receives roster coaching payments.</p></article></div><div class="card table-wrap"><table><thead><tr><th>Client</th><th>Subscription</th><th>Coach</th><th>Referral source</th></tr></thead><tbody><tr><td>Cedar Valley Group</td><td>Active</td><td>${engagements.partner?coaches.find(x=>x.id===engagements.partner.id).name:'Not assigned'}</td><td>Summit Leadership</td></tr></tbody></table></div><p class="muted">No other organizations, private coaching notes, or raw assessments are exposed. This view always represents the partner sample account.</p>`;
if(page==='Coach workspace')main.innerHTML=`<div class="eyebrow">Coach / Alex Morgan · Independent</div><h1>My coaching & referral activity</h1><div class="grid"><article class="card"><h3>Active client access</h3>${engagements.independent?.id==='alex'?'<p>Jordan Williams</p><p>Shared goal: improve delegation.</p><span class="tag">Active engagement</span>':'<p>No active assignment to Jordan.</p><span class="tag">Development access revoked</span>'}</article><article class="card"><h3>Subscription referral earnings</h3><p class="price">$240 / renewal</p><p>Cedar Valley Group · Subscription active</p><p class="muted">Referral earnings continue even if Jordan changes coaches.</p></article><article class="card"><h3>Private notes</h3><p>Separate from leader summaries and sponsor reporting.</p><p class="muted">Retention and post-engagement note access require an agreed policy before launch.</p></article></div><p>This sample coach view follows the independent-referral scenario. Switch to that scenario, end Alex’s engagement, and return here to see access removed while referral earnings remain.</p>`;
if(page==='Build roadmap')main.innerHTML=`<div class="eyebrow">Implementation proposal</div><h1>From partnership pilot to marketplace</h1><p>A phased build with permission and payment checks at every release.</p><div class="grid">${[['01 · Agree the rules','Confirm payer, commission basis, renewal continuity, company exit process, cancellation policies, and ownership of notes.'],['02 · Partner foundation','Build partner accounts, branded signup, organization referral attribution, and server-enforced client isolation.'],['03 · Coaching relationships','Add approved profiles, roster eligibility, accepted terms, sharing permissions, and hire/change/end workflows.'],['04 · Payments & reconciliation','Integrate provider onboarding, separate software commissions from coaching payments, and handle refunds and retries.'],['05 · Controlled pilot','One partner, two company coaches, two independent coaches. Validate isolation, billing, revocation, and reconciliation.'],['06 · Broader marketplace','Expand approved providers, scheduling, service packages, and two-way consulting referral reporting.']].map(x=>`<article class="card"><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join('')}</div><p>Detailed implementation plan accompanies this demo in <strong>build-plan.md</strong>. Planning range: 6–10 engineering weeks for a controlled pilot, subject to payment design and policy decisions.</p>`;
}
function profile(id){const c=allowed().find(x=>x.id===id);if(!c)return;modal.innerHTML=`<div class="eyebrow">Coach profile & sample service terms</div><h2>${c.name}</h2><span class="tag">${c.company}</span><p>${c.bio}</p><p><strong>Monthly:</strong> ${money(c.price)}, includes two 50-minute sessions. Renews monthly; cancel before renewal. Unused sessions expire at period end.</p><p><strong>Per session:</strong> ${money(c.call)} paid at booking. Cancellation at least 24 hours beforehand receives a refund; later cancellation is charged.</p><p>Shared goals and summaries stay with the client. Confidential notes are separate. These are proposed demo terms, not final service terms.</p>${current()?'<p class="notice">End your current engagement before hiring a replacement.</p>':`<label>Coaching offer <select id="offer"><option value="monthly">Monthly package</option><option value="call">Individual session</option></select></label><p><label><input type="checkbox" id="accept"> I accept the sample terms and authorize this simulated purchase.</label></p><p><label><input type="checkbox" id="share"> Share my goals and existing shared summary with this coach.</label></p>${action('Simulate hire · no charge','hire:'+id,'primary')}`} ${action('Close','close')}`;modal.showModal()}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();return}const a=b.dataset.action;if(a==='directory'){page='Find a coach';render()}if(a?.startsWith('profile:'))profile(a.split(':')[1]);if(a==='close')modal.close();if(a?.startsWith('hire:')){if(!document.querySelector('#accept').checked||!document.querySelector('#share').checked){announce('Accept the sample terms and sharing choice to continue.');return}const id=a.split(':')[1];if(current()||!allowed().some(c=>c.id===id))return;engagements[scenario]={id,kind:document.querySelector('#offer').value};events.push('Simulated hire: '+coaches.find(c=>c.id===id).name+' · '+source()+' retains software attribution.');modal.close();page='My development';render();announce('Coach hired in demo. Shared goals available; no money moved.')}if(a==='end'){modal.innerHTML=`<h2>End this coaching engagement?</h2><p>For this demo, access ends immediately and future coaching charges stop. Your development record and software referral attribution remain.</p><p>Production timing, remaining sessions, and refunds follow the accepted service terms.</p>${action('Confirm end · demo','confirm-end','primary')} ${action('Keep coach','close')}`;modal.showModal()}if(a==='confirm-end'){events.push('Ended '+coaches.find(c=>c.id===current().id).name+' engagement; access revoked. Referral source unchanged.');engagements[scenario]=null;modal.close();render();announce('Engagement ended. Choose another eligible coach; your development record stays.')}});
document.querySelector('#scenario').onchange=e=>{scenario=e.target.value;page='Welcome';announce('');render()};document.querySelector('#reset').onclick=()=>location.reload();render();
</script><script>

const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let companies=[{id:'summit',name:'Summit Leadership',initials:'SL',color:'#164c43',logo:'',headline:'Your development, connected.',description:'Build stronger leadership with a dedicated coaching team and a development plan that stays with you.',slug:'summit',clients:[{name:'Jordan Williams',email:'jordan@example.com',org:'Cedar Valley Group',status:'Active',last:'Sep 9, 2026 · 9:42 AM',date:'2026-09-09',coach:'Maya Bennett'},{name:'Robin Ellis',email:'robin@example.com',org:'Northstar Services',status:'Active',last:'Aug 18, 2026 · 2:15 PM',date:'2026-08-18',coach:'Daniel Reed'},{name:'Casey Taylor',email:'casey@example.com',org:'Harbor Works',status:'Invited',last:'Never signed in',date:null,coach:'Not assigned'}],bench:[{name:'Maya Bennett',email:'maya@example.com',specialty:'Executive coaching',status:'Active',capacity:3},{name:'Daniel Reed',email:'daniel@example.com',specialty:'Leadership development',status:'Active',capacity:2}],invites:[]}];
let selectedCompany='summit',companyTab='Overview',clientFilter='all',clientQuery='';
const company=()=>companies.find(c=>c.id===selectedCompany);
const companyMark=c=>`<div class="brandmark" style="--brand:${c.color}">${c.logo?`<img src="${c.logo}" alt="${esc(c.name)} logo">`:esc(c.initials)}</div>`;
const originalRender=render;
function field(label,id,value='',type='text'){return `<label class="field">${label}<input id="${id}" type="${type}" value="${esc(value)}" required></label>`}
function companyTabs(){return `<div class="subnav">${['Overview','Client portfolio','Coaching bench','Invitations','Branded landing page'].map(t=>action(t,'company-tab:'+t,companyTab===t?'primary':'')).join('')}</div>`}
function landing(c){return `<section class="hero" style="border-top:6px solid ${c.color}">${companyMark(c)}<p class="eyebrow">${esc(c.name)} + Leader Continuity</p><h1>${esc(c.headline)}</h1><p>${esc(c.description)}</p>${action('Request to join '+c.name,'join-company','primary')}<p class="hint">Your coaching choices stay within ${esc(c.name)}’s team. Your development plan remains yours.</p></section><div class="card"><h2>Meet your coaching team</h2><div class="grid">${c.bench.filter(b=>b.status==='Active').map(b=>`<article><h3>${esc(b.name)}</h3><p>${esc(b.specialty)}</p><span class="tag">${b.capacity} client openings</span></article>`).join('')||'<p>Your company is preparing its coaching team.</p>'}</div></div><p class="hint">Demo referral route: /partners/${esc(c.slug)} · Source is attached automatically at registration.</p>`}
render=function(){originalRender();const c=company();if(page==='Company setup'){main.innerHTML=`<div class="eyebrow">Platform owner / company administration</div><h1>Build a partner company</h1><p>Create each company from the same template, then let its administrators manage their brand, client portfolio, and coaching bench.</p><div class="row">${action('Create company from template','new-company','primary')}<span class="tag">${companies.length} company workspace${companies.length===1?'':'s'}</span></div><div class="grid">${companies.map(x=>`<article class="card">${companyMark(x)}<h2>${esc(x.name)}</h2><p>/partners/${esc(x.slug)}</p><p>${x.clients.length} introduced people · ${x.bench.length} coaches</p>${action('Open company workspace','open-company:'+x.id)} ${action('Edit branding','edit-company:'+x.id)}</article>`).join('')}</div><div class="notice">This company switcher is a platform-owner demo control. Company administrators only receive access to their own workspace.</div>`;return}
if(page!=='Partner workspace')return;
main.innerHTML=`<div class="eyebrow">Company administrator / ${esc(c.name)}</div><div class="row"><div><h1>${esc(c.name)}</h1><p class="muted">Your clients. Your coaching team. Your brand.</p></div>${companyMark(c)}</div>${companyTabs()}<div id="company-content"></div>`;
const content=document.querySelector('#company-content');
if(companyTab==='Overview')content.innerHTML=`<div class="row">${action('Invite a client','invite-client','primary')} ${action('Invite a coach','invite-coach')} ${action('Edit company branding','edit-company:'+c.id)}</div><div class="grid"><article class="card"><h3>Introduced clients</h3><p class="price">${c.clients.length}</p><p>${c.clients.filter(x=>x.status==='Active').length} active · ${c.clients.filter(x=>x.status==='Invited').length} invited</p></article><article class="card"><h3>Coaching bench</h3><p class="price">${c.bench.filter(x=>x.status==='Active').length} active</p><p>${c.bench.filter(x=>x.status==='Active').reduce((n,x)=>n+x.capacity,0)} available client openings</p></article><article class="card"><h3>Client follow-up</h3><p class="price">${c.clients.filter(x=>x.date&&x.date<'2026-08-26').length}</p><p>Active clients with no sign-in in 14+ days</p></article></div><div class="card"><h2>Your branded invitation page</h2><p>/partners/${esc(c.slug)}</p><p>Client invitations use this company’s branding and referral source. Coach invitations join the bench and do not create client referrals.</p>${action('Preview landing page','company-tab:Branded landing page')}</div>`;
if(companyTab==='Client portfolio'){content.innerHTML=`<div class="row"><div><h2>Clients you introduced</h2><p class="hint">One row per invited person, grouped by their organization. Last sign-in is shown in America/Denver. Demo as of September 9, 2026.</p></div>${action('Invite a client','invite-client','primary')}</div><div class="row"><label>Find client or organization <input id="client-query" value="${esc(clientQuery)}" style="padding:10px;font:inherit"></label><label>Status <select id="client-filter"><option value="all">All clients</option><option value="Active">Active</option><option value="Invited">Invited</option><option value="quiet">No sign-in in 14+ days</option></select></label></div><div class="card table-wrap" id="client-table"></div><p class="hint">Activity visibility is limited to sign-in recency. Coaching notes, assessments, and browsing history are not included.</p>`;document.querySelector('#client-filter').value=clientFilter;drawClients();document.querySelector('#client-filter').onchange=e=>{clientFilter=e.target.value;drawClients()};document.querySelector('#client-query').oninput=e=>{clientQuery=e.target.value;drawClients()}}
if(companyTab==='Coaching bench')content.innerHTML=`<div class="row"><div><h2>Build your coaching bench</h2><p>Invite coaches, review their profiles, and approve them before they appear to clients.</p></div>${action('Invite a coach','invite-coach','primary')}</div><div class="grid">${c.bench.map((b,i)=>`<article class="card"><h3>${esc(b.name)}</h3><span class="tag">${b.status}</span><p>${esc(b.specialty)}</p><p>${b.status==='Active'?b.capacity+' available client openings':'Not visible on the company landing page'}</p>${b.status==='Profile ready'?action('Approve for roster','approve-coach:'+i,'primary'):''}${b.status==='Active'?action('Edit capacity','capacity:'+i):''}</article>`).join('')||'<div class="card"><h3>Your bench starts here</h3><p>Invite your first coach to submit a profile.</p></div>'}</div>`;
if(companyTab==='Invitations')content.innerHTML=`<h2>Invitation activity</h2><p>Review proposed invitations, then simulate acceptance. No email is sent.</p><div class="row">${action('Invite a client','invite-client','primary')} ${action('Invite a coach','invite-coach')}</div><div class="card table-wrap"><table><thead><tr><th>Recipient</th><th>Type</th><th>Status</th><th>Action</th></tr></thead><tbody>${c.invites.map((v,i)=>`<tr><td>${esc(v.name)}<br><small>${esc(v.email)}</small></td><td>${v.type}</td><td>${v.status}</td><td>${v.status==='Pending'?action('Simulate acceptance','accept-invite:'+i)+' '+action('Revoke','revoke-invite:'+i):'—'}</td></tr>`).join('')||'<tr><td colspan="4">No new invitations. Invite a client or coach to try the workflow.</td></tr>'}</tbody></table></div>`;
if(companyTab==='Branded landing page')content.innerHTML=`<div class="row"><span class="tag">Public-facing page preview</span>${action('Edit branding','edit-company:'+c.id)}</div>${landing(c)}`;
};
function drawClients(){const rows=company().clients.filter(x=>(clientFilter==='all'||x.status===clientFilter||(clientFilter==='quiet'&&x.status==='Active'&&x.date&&x.date<'2026-08-26'))&&[x.name,x.org,x.email].join(' ').toLowerCase().includes(clientQuery.toLowerCase()));document.querySelector('#client-table').innerHTML=`<table><thead><tr><th>Client / organization</th><th>Status</th><th>Last sign-in</th><th>Coach</th></tr></thead><tbody>${rows.map(x=>`<tr><td><strong>${esc(x.name)}</strong><br>${esc(x.org)}<br><small>${esc(x.email)}</small></td><td><span class="tag">${x.status}</span></td><td>${x.last}</td><td>${esc(x.coach)}</td></tr>`).join('')||'<tr><td colspan="4">No matching clients.</td></tr>'}</tbody></table>`}
function brandForm(id){const c=companies.find(x=>x.id===id);modal.innerHTML=`<form id="brand-form"><h2>${c?'Edit company branding':'Create a company'}</h2><p>Every company starts with this reusable template.</p>${field('Company name','brand-name',c?.name||'')}${field('Page address (letters, numbers and hyphens)','brand-slug',c?.slug||'')}${field('Logo initials','brand-initials',c?.initials||'')}${field('Brand color','brand-color',c?.color||'#164c43','color')}<label class="field">Logo image (optional)<input id="brand-logo" type="file" accept="image/png,image/jpeg,image/webp"></label>${field('Landing page headline','brand-headline',c?.headline||'Develop your next generation of leaders.')}${field('Introduction','brand-description',c?.description||'Connect with our coaching team and build a practical leadership development plan.')}<button class="primary" type="submit">${c?'Save branding':'Create company workspace'}</button> ${action('Cancel','close')}</form>`;modal.showModal();document.querySelector('#brand-form').onsubmit=async e=>{e.preventDefault();const get=id=>document.querySelector(id).value.trim(),slug=get('#brand-slug').toLowerCase();if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)||companies.some(x=>x.slug===slug&&x.id!==id)){announce('Choose a unique page address using letters, numbers and hyphens.');return}const f=document.querySelector('#brand-logo').files[0];if(f&&(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>2000000)){announce('Choose a PNG, JPEG or WebP logo under 2 MB.');return}let logo=c?.logo||'';if(f)logo=await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(f)});const values={name:get('#brand-name'),slug,initials:get('#brand-initials').slice(0,3),color:get('#brand-color'),headline:get('#brand-headline'),description:get('#brand-description'),logo};if(c)Object.assign(c,values);else companies.push({id:'company-'+Date.now(),...values,clients:[],bench:[],invites:[]});selectedCompany=c?.id||companies[companies.length-1].id;modal.close();page='Partner workspace';companyTab='Branded landing page';render();announce('Company branding saved for this demo. Reload resets changes.')};}
function inviteForm(type){modal.innerHTML=`<form id="invite-form"><h2>Invite a ${type}</h2><p>From ${esc(company().name)} · ${type==='client'?'Includes your company referral source and branded signup page.':'Invites the coach to submit a profile for your roster.'}</p>${field('Full name','invite-name')}${field('Email address','invite-email','','email')}${field(type==='client'?'Client organization':'Coaching specialty','invite-detail')}<button class="primary" type="submit">Review invitation</button> ${action('Cancel','close')}</form>`;modal.showModal();document.querySelector('#invite-form').onsubmit=e=>{e.preventDefault();const value=id=>document.querySelector(id).value.trim(),v={name:value('#invite-name'),email:value('#invite-email'),detail:value('#invite-detail'),type,status:'Pending'};if(company().invites.some(x=>x.email.toLowerCase()===v.email.toLowerCase()&&x.type===type&&x.status==='Pending')){announce('A pending invitation already exists for this email.');return}modal.innerHTML=`<h2>Review ${type} invitation</h2><p><strong>To:</strong> ${esc(v.email)}</p><div class="card">${companyMark(company())}<h3>You’re invited to ${esc(company().name)}</h3><p>Hello ${esc(v.name)},</p><p>${type==='client'?'Join our leadership portfolio and connect with our coaching team. Your invitation includes our referral code.':'Join our coaching bench. Complete your profile for administrator approval before clients can select you.'}</p><p>Sample destination: /partners/${esc(company().slug)}/invite/[secure-token]</p></div><p class="hint">Preview only. No email will be sent.</p>${action('Create simulated invitation','commit-invite','primary')} ${action('Cancel','close')}`;modal.pendingInvite=v};}
document.addEventListener('click',e=>{const b=e.target.closest('button'),a=b?.dataset.action;if(!a)return;if(a==='new-company')brandForm();if(a.startsWith('edit-company:'))brandForm(a.split(':')[1]);if(a.startsWith('open-company:')){selectedCompany=a.split(':')[1];page='Partner workspace';companyTab='Overview';clientQuery='';clientFilter='all';render()}if(a.startsWith('company-tab:')){companyTab=a.split(':')[1];render()}if(a==='invite-client')inviteForm('client');if(a==='invite-coach')inviteForm('coach');if(a==='commit-invite'){const c=company(),v=modal.pendingInvite;if(!v)return;c.invites.push(v);if(v.type==='client')c.clients.push({name:v.name,email:v.email,org:v.detail,status:'Invited',last:'Never signed in',date:null,coach:'Not assigned'});else c.bench.push({name:v.name,email:v.email,specialty:v.detail,status:'Invited',capacity:0});modal.pendingInvite=null;modal.close();companyTab='Invitations';render();announce('Simulated invitation created. No message was sent.')}if(a.startsWith('accept-invite:')||a.startsWith('revoke-invite:')){const v=company().invites[Number(a.split(':')[1])];if(v.status!=='Pending')return;const accepted=a.startsWith('accept-');v.status=accepted?'Accepted':'Revoked';const record=(v.type==='client'?company().clients:company().bench).find(x=>x.email===v.email);record.status=accepted?(v.type==='client'?'Active':'Profile ready'):'Invitation revoked';if(accepted&&v.type==='client'){record.last='Sep 9, 2026 · 10:00 AM (simulated)';record.date='2026-09-09'}render();announce(accepted?'Acceptance simulated. Coaches require approval before publication.':'Invitation revoked in demo.')}if(a.startsWith('approve-coach:')){const coach=company().bench[Number(a.split(':')[1])];coach.status='Active';coach.capacity=1;render();announce('Coach approved and added to the branded page.')}if(a.startsWith('capacity:')){const index=Number(a.split(':')[1]),coach=company().bench[index];modal.innerHTML=`<form id="capacity-form"><h2>${esc(coach.name)} · Capacity</h2>${field('Available client openings','capacity-value',coach.capacity,'number')}<button class="primary" type="submit">Save capacity</button> ${action('Cancel','close')}</form>`;modal.showModal();document.querySelector('#capacity-value').min=0;document.querySelector('#capacity-value').max=100;document.querySelector('#capacity-form').onsubmit=e=>{e.preventDefault();const n=Number(document.querySelector('#capacity-value').value);if(!Number.isInteger(n)||n<0||n>100)return;coach.capacity=n;modal.close();render()}}if(a==='join-company'){modal.innerHTML=`<h2>Join ${esc(company().name)}</h2><p>This signup would attach referral source <strong>${esc(company().slug)}</strong> to the client organization and limit coach selection to this company’s approved roster.</p><p>In this demo, use “Invite a client” and simulate acceptance to add someone to the portfolio.</p>${action('Close','close')}`;modal.showModal()}});
page='Company setup';render();
